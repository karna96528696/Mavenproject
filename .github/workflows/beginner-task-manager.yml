name: Beginner task manager
on:
  push:
    branches: [main, beginner/task-manager]
    paths: ['beginner-task-manager/**', '.github/workflows/beginner-task-manager.yml']
  pull_request:
    paths: ['beginner-task-manager/**', '.github/workflows/beginner-task-manager.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beginner-task-manager/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: beginner-task-manager/backend/pom.xml
      - run: mvn -B verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beginner-task-manager/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: beginner-task-manager/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
